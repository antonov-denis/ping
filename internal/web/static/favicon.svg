<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200"
     role="img"
     aria-labelledby="title desc">
  <title id="title">ping</title>
  <desc id="desc">Three uptime bars in a hard-bordered square with an offset shadow.</desc>
  <!-- Offset shadow, square edges, 12px ink border: the same three moves the
       whole site is built from. -->
  <rect x="34" y="34" width="150" height="150" fill="#1c1725"/>
  <rect x="16" y="16" width="150" height="150" fill="#fbf7ff" stroke="#1c1725" stroke-width="12"/>
  <rect x="52" y="58" width="22" height="66" fill="#2f8f5b"/>
  <rect x="80" y="58" width="22" height="66" fill="#2f8f5b"/>
  <rect x="108" y="58" width="22" height="66" fill="#c0392b"/>
</svg>
